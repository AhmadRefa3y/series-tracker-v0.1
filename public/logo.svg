<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient - blue to teal -->
    <radialGradient id="modernGradient" cx="24" cy="24" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset=".2" stop-color="#2563eb"/>
      <stop offset=".4" stop-color="#1d4ed8"/>
      <stop offset=".6" stop-color="#1e40af"/>
      <stop offset=".8" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0f766e"/>
    </radialGradient>
    
    <!-- Glass effect -->
    <linearGradient id="glassEffect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- Inner glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main background with rounded corners -->
  <rect x="0" y="0" width="48" height="48" rx="12" ry="12" fill="url(#modernGradient)" filter="url(#shadow)"/>
  
  <!-- Glass overlay -->
  <rect x="0" y="0" width="48" height="48" rx="12" ry="12" fill="url(#glassEffect)" opacity="0.6"/>
  
  <!-- Play button icon (redesigned) -->
  <g transform="translate(24, 24)" filter="url(#glow)">
    <!-- Main play triangle -->
    <path d="M-6 -8 L-6 8 L8 0 Z" fill="white" opacity="0.95"/>
  </g>
  
  <!-- Progress tracking dots -->
  <g transform="translate(24, 36)" opacity="0.9">
    <circle cx="-12" cy="0" r="1.5" fill="#ffffff"/>
    <circle cx="-6" cy="0" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="6" cy="0" r="1.5" fill="#ffffff" opacity="0.4"/>
    <circle cx="12" cy="0" r="1.5" fill="#ffffff" opacity="0.2"/>
  </g>
  
  <!-- Decorative corner elements -->
  <g opacity="0.3">
    <rect x="6" y="6" width="2" height="2" rx="1" fill="#ffffff" transform="rotate(45 7 7)"/>
    <rect x="40" y="6" width="2" height="2" rx="1" fill="#ffffff" transform="rotate(45 41 7)"/>
  </g>
  
  <!-- Animated pulse effect -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="14;18;14" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Side accent bars -->
  <g opacity="0.7">
    <rect x="4" y="14" width="1" height="6" rx="0.5" fill="#ffffff"/>
    <rect x="4" y="22" width="1" height="4" rx="0.5" fill="#ffffff" opacity="0.7"/>
    <rect x="4" y="28" width="1" height="6" rx="0.5" fill="#ffffff" opacity="0.5"/>
    
    <rect x="43" y="16" width="1" height="4" rx="0.5" fill="#ffffff"/>
    <rect x="43" y="22" width="1" height="6" rx="0.5" fill="#ffffff" opacity="0.7"/>
    <rect x="43" y="30" width="1" height="2" rx="0.5" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>